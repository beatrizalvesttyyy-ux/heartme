<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proteção de Elyndra — Heart Me</title>
<style>
:root{--violet:#a72bff;--bright:#f2c8ff;--dark:#10051c;--silver:#d9c8e8;--fill:0%}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
body{font-family:Georgia,"Times New Roman",serif;color:#fff}
.stage{position:relative;width:560px;height:900px;background:transparent;overflow:hidden}
.wrap{position:absolute;left:26px;top:18px;width:300px;height:850px;filter:drop-shadow(0 0 12px #8c20ff80)}
.head{position:absolute;top:0;left:50%;transform:translateX(-50%);width:208px;height:170px;z-index:4}
.rune{position:absolute;inset:4px 28px 2px;border:2px solid #bfa0df;border-radius:48% 48% 18% 18%;background:linear-gradient(135deg,#12091f,#29103d 48%,#090410);clip-path:polygon(50% 0,72% 18%,95% 28%,85% 73%,50% 100%,15% 73%,5% 28%,28% 18%);box-shadow:inset 0 0 16px #ad35ff,0 0 20px #a72bff}
.rune:before{content:"";position:absolute;inset:15px;border:1px solid #f2c8ff;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);opacity:.8}
.gem{position:absolute;left:50%;top:31px;transform:translateX(-50%);width:48px;height:66px;background:linear-gradient(135deg,#f5d5ff,#a72bff 35%,#4e0b94 65%,#f2c8ff);clip-path:polygon(50% 0,100% 28%,78% 82%,50% 100%,22% 82%,0 28%);filter:drop-shadow(0 0 14px #d24dff)}
.heart{position:absolute;left:50%;top:102px;transform:translateX(-50%);font-size:36px;color:#f6c9ff;text-shadow:0 0 8px #e24cff,0 0 20px #a72bff}
.plaque{position:absolute;top:143px;left:0;width:300px;padding:13px 10px 12px;text-align:center;background:linear-gradient(180deg,#1c0a2bfa,#08030ff5);border:2px solid #d5b7ef;outline:1px solid #7e38ad;clip-path:polygon(7% 0,93% 0,100% 22%,96% 78%,87% 100%,13% 100%,4% 78%,0 22%);z-index:5}
.kicker{font-size:16px;letter-spacing:3px;color:#f1d5ff;text-shadow:0 0 8px #a72bff}
.count{font-size:31px;line-height:1.15;color:#fff;text-shadow:0 0 12px #bd57ff;white-space:nowrap}
.sub{font:11px Arial,sans-serif;letter-spacing:2px;color:#d7b9f0;margin-top:4px}
.frame{position:absolute;left:74px;top:245px;width:152px;height:570px;border:3px solid #c8b1df;border-radius:28px 28px 20px 20px;background:linear-gradient(90deg,#090410,#28103c 18%,#080310 45%,#36104f 70%,#090410);box-shadow:inset 0 0 0 3px #301345,inset 0 0 15px #a72bff,0 0 14px #b744ff}
.frame:before,.frame:after{content:"✦";position:absolute;left:50%;transform:translateX(-50%);color:#efcfff;text-shadow:0 0 12px #b42cff;font-size:27px;z-index:3}
.frame:before{top:-23px}.frame:after{bottom:-23px}
.track{position:absolute;inset:14px 17px;border:1px solid #a77fc8;border-radius:18px;background:rgba(4,1,9,.85);overflow:hidden}
.energy{position:absolute;left:0;right:0;bottom:0;height:var(--fill);min-height:2%;background:linear-gradient(0deg,#6c13cb 0%,#a72bff 45%,#e9aaff 100%);box-shadow:0 0 12px #b42cff,0 0 30px #8a16ff;transition:height .45s ease}
.energy:before{content:"";position:absolute;left:-30%;right:-30%;top:-8px;height:18px;background:#f7dcff;border-radius:50%;filter:blur(8px);box-shadow:0 0 18px #e8aaff}
.energy:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 38px,#f5d8ff44 39px 41px);opacity:.6}
.hearts{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-around;align-items:center;padding:15px 0;z-index:2}
.hearts span{font-size:25px;color:#6f4a89;text-shadow:0 0 4px #a72bff55;transition:color .25s,text-shadow .25s}
.hearts span.on{color:#fff0ff;text-shadow:0 0 7px #fff,0 0 15px #dc66ff,0 0 22px #a72bff}
.side-label{position:absolute;left:0;top:420px;width:66px;text-align:center;font-size:10px;letter-spacing:1px;line-height:1.6;color:#e6c7ff;writing-mode:vertical-rl;transform:rotate(180deg)}
.bottom{position:absolute;left:48px;top:831px;width:205px;text-align:center;font-size:11px;letter-spacing:2px;color:#e6c7ff;text-shadow:0 0 8px #a72bff}
.spark{position:absolute;color:#dcb0ff;text-shadow:0 0 10px #b42cff;animation:twinkle 1.8s infinite alternate}
.s1{left:32px;top:320px}.s2{right:22px;top:370px;animation-delay:.7s}.s3{left:35px;top:720px;animation-delay:1s}.s4{right:22px;top:680px;animation-delay:.3s}
@keyframes twinkle{from{opacity:.35;transform:scale(.75)}to{opacity:1;transform:scale(1.25)}}
.demo{position:absolute;left:345px;top:24px;width:195px;padding:12px;background:#10051eee;border:1px solid #b87ae5;border-radius:10px;font:12px Arial,sans-serif;color:white}
.demo button{width:100%;margin-top:7px;padding:8px;background:#40136b;color:white;border:1px solid #c99bea;border-radius:6px;cursor:pointer}
.demo small{display:block;color:#d8b8f4;line-height:1.5}
.status{margin-top:7px;color:#e3c8ff}
body:not(.demo-mode) .demo{display:none}
</style>
</head>
<body>
<div class="stage">
  <div class="wrap">
    <div class="head"><div class="rune"></div><div class="gem"></div><div class="heart">♥</div></div>
    <div class="plaque">
      <div class="kicker">HEART ME</div>
      <div class="count"><span id="count">0</span> / <span id="goal">100</span></div>
      <div class="sub">FORTALECE A PROTEÇÃO</div>
    </div>
    <div class="side-label">PROTEÇÃO DE ELYNDRA</div>
    <div class="frame">
      <div class="track"><div class="energy" id="energy"></div>
        <div class="hearts" id="hearts">
          <span>♥</span><span>♥</span><span>♥</span><span>♥</span><span>♥</span><span>♥</span><span>♥</span><span>♥</span><span>♥</span><span>♥</span>
        </div>
      </div>
    </div>
    <div class="spark s1">✦</div><div class="spark s2">✧</div><div class="spark s3">✦</div><div class="spark s4">✧</div>
    <div class="bottom">PORTÃO DE ELYNDRA</div>
  </div>
  <div class="demo">
    <b>Prévia / teste</b>
    <small>Use estes botões para testar a animação. Para receber eventos reais, mantenha o TikFinity conectado à live.</small>
    <button id="add">+1 Heart Me (teste)</button>
    <button id="add10">+10 Heart Me (teste)</button>
    <button id="reset">Zerar contador</button>
    <div class="status" id="status">Modo demonstração</div>
    <small style="margin-top:7px">Eventos: <span id="eventStatus">aguardando conexão local…</span></small>
  </div>
</div>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  if (params.has('demo')) document.body.classList.add('demo-mode');
  let total = 0;
  const goal = 100;
  const countEl = document.getElementById('count');
  const energy = document.getElementById('energy');
  const hearts = [...document.querySelectorAll('#hearts span')];
  const status = document.getElementById('status');
  const eventStatus = document.getElementById('eventStatus');
  document.getElementById('goal').textContent = goal;

  function render() {
    countEl.textContent = total.toLocaleString('pt-BR');
    const pct = Math.min(100, total / goal * 100);
    energy.style.setProperty('--fill', pct + '%');
    energy.style.height = pct + '%';
    hearts.forEach((h,i) => h.classList.toggle('on', pct >= ((i+1)/hearts.length)*100));
    if (status) status.textContent = `Proteção: ${Math.round(pct)}%`;
  }
  function add(n=1) { total += n; render(); }
  document.getElementById('add').addEventListener('click', () => add(1));
  document.getElementById('add10').addEventListener('click', () => add(10));
  document.getElementById('reset').addEventListener('click', () => { total=0; render(); });

  // TikFinity local Events API. Gift payload shapes can vary by version.
  function findStrings(obj, out=[], depth=0) {
    if (!obj || depth>5) return out;
    if (typeof obj === 'string') out.push(obj);
    else if (Array.isArray(obj)) obj.forEach(v=>findStrings(v,out,depth+1));
    else if (typeof obj === 'object') Object.entries(obj).forEach(([k,v]) => {
      if (/gift.?name|giftname|gift.?title/i.test(k) && typeof v==='string') out.push(v);
      else if (typeof v==='object') findStrings(v,out,depth+1);
    });
    return out;
  }
  function getRepeat(obj) {
    const keys=['repeatCount','repeat_count','comboCount','combo_count','repeat'];
    const q=[obj];
    while(q.length) {
      const o=q.shift();
      if(!o || typeof o!=='object') continue;
      for(const k of keys) if(Number.isFinite(Number(o[k])) && Number(o[k])>1) return Number(o[k]);
      Object.values(o).forEach(v=>{if(v && typeof v==='object')q.push(v)});
    }
    return 1;
  }
  try {
    const ws = new WebSocket('ws://127.0.0.1:21213/');
    ws.onopen = () => { if(eventStatus) eventStatus.textContent='conectado'; };
    ws.onerror = () => { if(eventStatus) eventStatus.textContent='sem conexão — confira o TikFinity'; };
    ws.onclose = () => { if(eventStatus) eventStatus.textContent='desconectado'; };
    ws.onmessage = ev => {
      try {
        const msg = JSON.parse(ev.data);
        const eventName = String(msg.event || msg.type || '').toLowerCase();
        if (!eventName.includes('gift')) return;
        const names = findStrings(msg.data || msg);
        if (names.some(s => /heart\s*me/i.test(s))) add(getRepeat(msg.data || msg));
      } catch(e) {}
    };
  } catch(e) { if(eventStatus) eventStatus.textContent='WebSocket indisponível'; }
  render();
})();
</script>
</body>
</html>
